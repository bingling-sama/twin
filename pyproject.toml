[project]
name = "twin"
version = "0.1.0"
description = "Two-stage image similarity search and deduplication system"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "open-clip-torch>=2.24.0",
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "Pillow>=10.0.0",
    "imagehash>=4.3.0",
    "pydantic-settings>=2.3.0",
    "python-multipart>=0.0.9",
    "aiohttp>=3.14.0",
    "scikit-image>=0.26.0",
]

[project.optional-dependencies]
cpu = [
    "faiss-cpu>=1.8.0",
]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
]
# faiss-gpu is conda-only (not on PyPI).  CUDA users must install it
# via conda BEFORE pip-installing this package without the [cpu] extra:
#   conda install faiss-gpu -c pytorch -c nvidia
#   pip install -e ".[dev]"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/twin"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.15",
]
bench = [
    "pytest-benchmark>=5.0.0",
    "psutil>=6.0.0",
]
